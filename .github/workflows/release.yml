name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    uses: damian1000/.github/.github/workflows/release.yml@main
    with:
      # `build` covers the distribution: the application plugin wires distTar and distZip into
      # assemble, so the archives staged below are the ones the verified build produced.
      build-command: clean build
      artifact-paths: |
        build/distributions/bank-csv-to-qif-*.tar
        build/distributions/bank-csv-to-qif-*.zip
